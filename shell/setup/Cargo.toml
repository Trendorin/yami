[package]
name = "yami-setup"
version = "2.7.0"
edition = "2021"
description = "First-run setup of the yami desktop: language, look and which modules to install"
license = "MIT"
publish = false

[[bin]]
name = "yami-setup"
path = "src/main.rs"

[dependencies]
yami-px = { git = "https://github.com/Trendorin/yami-px", tag = "v3.0.0" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
libc = "0.2"
