[package]
name = "yami-shell"
version = "3.0.0"
edition = "2021"
description = "A lightweight pixel-art Wayland shell for the niri compositor"
readme = "../README.md"
keywords = ["wayland", "niri", "shell", "layer-shell", "desktop"]
categories = ["gui"]
license = "MIT"

[[bin]]
name = "yami-shell"
path = "src/main.rs"

[features]
# Package managers own upgrades; disable the CLI/GUI updater and scheduled checks.
package-managed = []

[dependencies]
# the drawing library lives here (px/); the modules take it by the tag px-vX.Y.Z of this repository
yami-px = { path = "px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# blocking 1.7 keeps idle pool threads forever, each waking twice a second (zbus closes sockets
# and reads peer credentials there); 1.6 lets them exit after 500 ms idle
blocking = "=1.6.2"
libc = "0.2"

[workspace]
members = ["dev", "px", "agents"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
