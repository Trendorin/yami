[package]
name = "yami-dev"
version = "3.0.0"
edition = "2021"
description = "Developer tools of the yami repository: documentation and translation checks, README pictures"
license = "MIT"
publish = false

[[bin]]
name = "yami-dev"
path = "src/main.rs"

[dependencies]
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
serde_json = "1"
