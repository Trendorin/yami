# yami: written by yami-shell (settings → services); edit it there or in yami-shell.json
# file dialogs come from yami-files, the screen-share picker from yami-agents;
# the rest as niri ships it
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=yami;gtk;
org.freedesktop.impl.portal.ScreenCast=yami-agents;gnome;
