name: distros
# the installer's package lists and a source build on every family it supports
on:
  push:
    branches: [main]
    paths: [install.sh, installer/**, shell/**, tools/ci-distro.sh, .github/workflows/distros.yml]
  pull_request:
    paths: [install.sh, installer/**, shell/**, tools/ci-distro.sh, .github/workflows/distros.yml]
  schedule:
    # weekly: repositories change under us even when the code does not
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arch, image: "archlinux:latest", prep: "pacman -Syu --noconfirm --needed bash sudo" }
          - { name: fedora, image: "fedora:latest", prep: "dnf -q -y install bash sudo findutils util-linux shadow-utils" }
          - { name: debian, image: "debian:trixie", prep: "apt-get update -q && apt-get install -y -q bash sudo" }
          - { name: ubuntu, image: "ubuntu:24.04", prep: "apt-get update -q && apt-get install -y -q bash sudo" }
          - { name: opensuse, image: "opensuse/tumbleweed:latest", prep: "zypper -q -n install bash sudo gawk shadow" }
          - { name: void, image: "ghcr.io/void-linux/void-glibc-full:latest", prep: "xbps-install -Syu -y xbps && xbps-install -y bash sudo shadow" }
          - { name: alpine, image: "alpine:edge", prep: "apk add -q bash sudo shadow coreutils" }
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: base tools
        run: ${{ matrix.prep }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: package names, build, installer dry run
        run: bash tools/ci-distro.sh
