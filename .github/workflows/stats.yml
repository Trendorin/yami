# Installs for the README badge: install.sh downloads `yami-installs.txt` from the fixed `installs`
# release once per machine (docs/SECURITY.md, «Install count»), and GitHub counts release downloads.
# The badge is the sum over every release (older versions fetched it from the latest one): machines
# that installed yami, each once. Nothing else is collected. Writes badge.json (a shields.io endpoint) to the `stats` branch, so main gets no daily
# commits. The optional STATS_TOKEN (read-only «Administration») only adds GitHub's clone traffic
# to the log, for comparison; the badge does not use it.
name: stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  badge:
    runs-on: ubuntu-latest
    # writes only badge.json on the stats branch
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: count and write the badge
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # every copy of the counter file, on any release, in one query
          installs="$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].assets[] | select(.name == "yami-installs.txt") | .download_count' | awk '{ n += $1 } END { print n + 0 }')"
          if [ -n "${STATS_TOKEN:-}" ]; then
            GH_TOKEN="$STATS_TOKEN" gh api "repos/$REPO/traffic/clones" --jq '"for comparison, unique cloners over 14 days (bots and CI included): \(.uniques)"' || true
          fi
          badge="$(jq -cn --arg n "$installs" '{schemaVersion: 1, label: "installs", message: $n, color: "a8a29c"}')"
          content="$(printf '%s\n' "$badge" | base64 -w0)"
          # the stats branch: an orphan with one file, made on the first run
          if ! gh api "repos/$REPO/git/ref/heads/stats" >/dev/null 2>&1; then
            blob="$(gh api "repos/$REPO/git/blobs" -f content="$content" -f encoding=base64 --jq .sha)"
            tree="$(jq -cn --arg b "$blob" '{tree: [{path: "badge.json", mode: "100644", type: "blob", sha: $b}]}' | gh api "repos/$REPO/git/trees" --input - --jq .sha)"
            commit="$(jq -cn --arg t "$tree" '{message: "stats: badge", tree: $t, parents: []}' | gh api "repos/$REPO/git/commits" --input - --jq .sha)"
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/stats -f sha="$commit" >/dev/null
          else
            cur="$(gh api "repos/$REPO/contents/badge.json?ref=stats")"
            if [ "$(jq -r .content <<<"$cur" | tr -d '\n')" != "$content" ]; then
              gh api -X PUT "repos/$REPO/contents/badge.json" -f message="stats: $installs installs" -f content="$content" -f branch=stats -f sha="$(jq -r .sha <<<"$cur")" >/dev/null
            fi
          fi
          echo "installs: $installs"
